# Checks the Supabase migrations BEFORE they reach Test / Production:
# every pull request (and push to develop) applies supabase/migrations + supabase/seed.sql
# to an empty, throw-away PostgreSQL inside the GitHub runner – twice, to prove that a second
# run changes nothing. No secrets needed, so it also works for pull requests from forks.

name: check-migrations

on:
  pull_request:
    paths: ['supabase/**']
  push:
    branches: [develop]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Apply migrations + seed (1st run)
        run: supabase db push --remote="$DB_URL" --include-seed --yes

      - name: Apply again (2nd run must be "up to date")
        run: supabase db push --remote="$DB_URL" --include-seed --yes

      - name: Show the result
        run: |
          psql "$DB_URL" -c 'SELECT * FROM "Students";'
          psql "$DB_URL" -c 'SELECT version, name FROM supabase_migrations.schema_migrations;'
