# Swagger UI for the Supabase Edge Function API → GitHub Pages
#   https://tadasbulis-practice.github.io/SimpleStudentSystem/
#
# Edge Functions may not serve HTML, so Swagger UI is this static page (folder swagger-ui/).
# It is published whenever main changes (= every Production release) or with "Run workflow".
# One time: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: pages

on:
  push:
    branches: [main]
    paths: ['swagger-ui/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: swagger-ui
      - id: deployment
        uses: actions/deploy-pages@v4
